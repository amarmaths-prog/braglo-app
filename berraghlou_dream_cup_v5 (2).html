 /* إعدادات Firebase Firestore السحابية (يمكن تعديلها مباشرة من لوحة المدير داخل التطبيق) */
 const defaultFirebaseConfig = {
 // apiKey: "YOUR_API_KEY",
 // authDomain: "YOUR_AUTH_DOMAIN",
 // projectId: "YOUR_PROJECT_ID",
 // storageBucket: "YOUR_STORAGE_BUCKET",
 // messagingSenderId: "YOUR_MESSAGING_ID",
 // appId: "YOUR_APP_ID"
 };

 let activeConfig = defaultFirebaseConfig;
 try {
 const savedCfg = localStorage.getItem('berraghlou_firebase_cfg');
 if (savedCfg) {
 const parsedCfg = JSON.parse(savedCfg);
 if (parsedCfg && parsedCfg.apiKey && parsedCfg.projectId) {
 activeConfig = parsedCfg;
 }
 }
 } catch (e) {}
 
 let app, db, auth;
 try {
 if (activeConfig && activeConfig.apiKey && activeConfig.projectId) {
 app = initializeApp(activeConfig);
 db = getFirestore(app);
 auth = getAuth(app);
 }
 } catch (e) {
 console.warn("Firebase Firestore init fallback:", e);
 }

 window.db = db;
 window.auth = auth;
 window.doc = doc;
 window.setDoc = setDoc;
 window.onSnapshot = onSnapshot;
 window.signInAnonymously = signInAnonymously;
 window.initFirebaseDynamic = (cfg) => {
 const dynApp = initializeApp(cfg, "dynamic_" + Date.now());
 window.db = getFirestore(dynApp);
 window.auth = getAuth(dynApp);
 window.dispatchEvent(new CustomEvent('berraghlou-firebase-ready'));
 return { db: window.db, auth: window.auth };
 };

 const applyCloudPayload = (data) => {
 if (!data || typeof data !== 'object') return false;
 let applied = false;
 if (Array.isArray(data.matches) && data.matches.length >= 24) { setMatches(data.matches); applied = true; }
 if (Array.isArray(data.knockoutMatches) && data.knockoutMatches.length > 0) { setKnockoutMatches(data.knockoutMatches); applied = true; }
 if (Array.isArray(data.players) && data.players.length > 0) { setPlayers(data.players); applied = true; }
 if (Array.isArray(data.scorers) && data.scorers.length > 0) { setScorers(data.scorers); applied = true; }
 if (Array.isArray(data.chatMessages)) { setChatMessages(data.chatMessages); applied = true; }
 if (Array.isArray(data.bestPlayers) && data.bestPlayers.length > 0) { setBestPlayers(data.bestPlayers); applied = true; }
 if (Array.isArray(data.tickerMessages) && data.tickerMessages.length > 0) { setTickerMessages(data.tickerMessages); applied = true; }
 if (Array.isArray(data.notifications)) {
 const lastSeenId = Number(localStorage.getItem('lastSeenNotificationId') || 0);
 setNotifications(data.notifications);
 setUnreadCount(data.notifications.filter(n => n.id > lastSeenId).length);
 applied = true;
 }
 if (applied) {
 localStorage.setItem('berraghlouData_v5', JSON.stringify(data));
 }
 return applied;
 };

 // الاتصال الفوري في الوقت الفعلي عبر Firebase Firestore مع احتياطي سحابي ومحلي
 React.useEffect(() => {
 let pollInterval = null;
 let unsubscribeFirestore = null;
 let isCancelled = false;

 const startRestCloudSync = async () => {
 const bucket = (cloudBinId || 'berraghlou-dream-cup-2026-live').replace(/[^a-zA-Z0-9_-]/g, '');
 const cloudUrl = `https://kvdb.io/A9xK7mP2qR8vL4nW6zT1/${bucket}`;
 try {
 const res = await fetch(cloudUrl, { method: 'GET', cache: 'no-store' });
 if (!isCancelled && res.ok) {
 const text = await res.text();
 if (text && text.trim().startsWith('{')) {
 const cloudData = JSON.parse(text);
 if (applyCloudPayload(cloudData)) {
 setCloudMode('cloud_rest');
 setCloudStatus('متصل بالسحابة (مباشر)');
 } else {
 loadLocalFallback();
 setCloudMode('cloud_rest');
 setCloudStatus('متصل بالسحابة (جاهز)');
 }
 } else {
 loadLocalFallback();
 setCloudMode('cloud_rest');
 setCloudStatus('متصل بالسحابة (جاهز)');
 }
 } else if (!isCancelled) {
 loadLocalFallback();
 setCloudMode('cloud_rest');
 setCloudStatus('متصل بالسحابة (جاهز)');
 }
 } catch (e) {
 if (!isCancelled) {
 loadLocalFallback();
 setCloudMode('local');
 setCloudStatus('وضع محلي (بدون إنترنت)');
 }
 }

 pollInterval = setInterval(async () => {
 if (document.hidden || isCancelled) return;
 try {
 const r = await fetch(cloudUrl, { method: 'GET', cache: 'no-store' });
 if (r.ok) {
 const txt = await r.text();
 if (txt && txt.trim().startsWith('{')) {
 const remote = JSON.parse(txt);
 setCloudMode('cloud_rest');
 setCloudStatus('متصل بالسحابة (مباشر)');
 if (!window.__adminDirtyFlag) {
 applyCloudPayload(remote);
 }
 }
 }
 } catch (_) {}
 }, 8000);
 };

 const attachFirestoreListener = async () => {
 if (!window.db || !window.doc || !window.onSnapshot) {
 startRestCloudSync();
 return;
 }
 try {
 if (window.auth && window.signInAnonymously) {
 await window.signInAnonymously(window.auth).catch(() => {});
 }
 if (isCancelled) return;
 const docKey = (firestoreDocId || 'berraghlou2026').trim() || 'berraghlou2026';
 const tournamentRef = window.doc(window.db, "tournaments", docKey);
 unsubscribeFirestore = window.onSnapshot(
 tournamentRef,
 (docSnap) => {
 if (isCancelled) return;
 setCloudMode('firebase');
 setCloudStatus('مزامنة فورية (Firestore Live)');
 if (docSnap.exists()) {
 if (!window.__adminDirtyFlag) {
 applyCloudPayload(docSnap.data());
 }
 } else {
 loadLocalFallback();
 }
 },
 (err) => {
 console.warn("Firestore snapshot fallback:", err);
 if (!isCancelled) startRestCloudSync();
 }
 );
 } catch (e) {
 if (!isCancelled) startRestCloudSync();
 }
 };

 attachFirestoreListener();

 return () => {
 isCancelled = true;
 if (unsubscribeFirestore) unsubscribeFirestore();
 if (pollInterval) clearInterval(pollInterval);
 };
 }, [cloudBinId, firestoreDocId, firebaseEpoch]);
